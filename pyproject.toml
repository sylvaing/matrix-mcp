[project]
name = "matrix-mcp"
version = "0.2.1"
description = "Multi-homeserver Matrix MCP server — read, search, and send messages in Matrix rooms from any MCP client"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Rommy" }]
requires-python = ">=3.11"
keywords = ["matrix", "mcp", "model-context-protocol", "chat", "synapse"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Communications :: Chat",
]
dependencies = [
    "fastmcp>=3.4,<4",
    "httpx>=0.27.0",
    "starlette>=0.37.0",
    "uvicorn>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5",
    "pytest-timeout>=2",
    "ruff>=0.5",
]

[project.scripts]
matrix-mcp = "matrix_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
