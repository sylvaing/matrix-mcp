services:
  matrix-mcp:
    build: .
    container_name: matrix-mcp
    restart: unless-stopped
    env_file: .env
    environment:
      - HOST=0.0.0.0
      - PORT=${PORT:-3300}
    ports:
      # Bind to loopback by default; put a TLS reverse proxy in front for
      # anything beyond localhost. Change to "3300:3300" to expose on the LAN.
      - "127.0.0.1:${PORT:-3300}:${PORT:-3300}"
    # --- hardening ---
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 400m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:3300/health', timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
